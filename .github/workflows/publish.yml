name: Publish PyPI + MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release version matches GitHub Release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match package version {expected!r}")
          print(f"Release tag matches package version: {actual}")
          PY

      - name: Run release metadata and privacy checks
        run: |
          python -m unittest discover -s tests -p 'test_release_metadata.py' -v
          python scripts/release_check.py

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Smoke-test built wheel and public entrypoints
        run: |
          python -m venv /tmp/ofo-release
          /tmp/ofo-release/bin/python -m pip install --upgrade pip
          /tmp/ofo-release/bin/python -m pip install dist/open_family_office-*.whl 'mcp>=1.10,<2'
          /tmp/ofo-release/bin/ofo --version
          /tmp/ofo-release/bin/open-family-office --version
          /tmp/ofo-release/bin/open-family-office mcp --help

      - name: Validate server.json with pinned MCP Publisher
        run: |
          curl -fsSLo /tmp/mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate server.json

      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/open-family-office/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-dists
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: true
          print-hash: true
          attestations: true

  mcp-registry:
    name: Publish to MCP Registry
    needs: pypi
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          print("version=" + tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY

      - name: Wait for the PyPI release to become readable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://pypi.org/pypi/open-family-office/${VERSION}/json" >/dev/null; then
              echo "PyPI version ${VERSION} is available."
              exit 0
            fi
            echo "Waiting for PyPI propagation (attempt ${attempt}/20)..."
            sleep 6
          done
          echo "PyPI version did not become readable in time." >&2
          exit 1

      - name: Install pinned MCP Publisher
        run: |
          curl -fsSLo /tmp/mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: /tmp/mcp-publisher login github-oidc

      - name: Publish MCP metadata
        run: /tmp/mcp-publisher publish server.json
